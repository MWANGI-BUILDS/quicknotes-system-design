<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <p class="eyebrow">QUICKNOTES / API CLIENT</p>
      <h1>Your notes, in motion.</h1>
      <p class="intro">A small client for trying out the QuickNotes service.</p>
    </header>

    <section class="composer" aria-labelledby="composer-heading">
      <h2 id="composer-heading">Write a note</h2>
      <form id="note-form">
        <label for="title-input">Title <span aria-hidden="true">*</span></label>
        <input id="title-input" name="title" type="text" maxlength="100" required>
        <label for="body-input">Note</label>
        <textarea id="body-input" name="body" rows="4"></textarea>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR COLLECTION</p>
          <h2 id="notes-heading">Notes</h2>
        </div>
        <button id="load-btn" class="button-secondary" type="button">Load notes</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p>
      <ul id="notes-list" aria-label="Notes"></ul>
    </section>
  </main>
</body>
</html>
